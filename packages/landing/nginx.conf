server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxies the waitlist form to the api container over the compose
    # network (service name "api" resolves there, see docker-compose.yml /
    # docker-compose.prod.yml). This is the only way the browser reaches the
    # api: landing is the only service with a public nginx route (see
    # DEPLOY.md), the api container itself stays bound to 127.0.0.1 and is
    # never exposed directly.
    location /v1/ {
        proxy_pass http://api:3000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
