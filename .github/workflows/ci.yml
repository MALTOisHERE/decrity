name: CI

# Runs on every push and PR: lint, build (type-check), test. This is what
# actually runs on push, not docker-build.yml or docker-deploy.yml, both of
# which are manual-trigger only (see DEPLOY.md).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
