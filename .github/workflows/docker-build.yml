name: Build and push Docker images

# Builds service images here and pushes them to GHCR. Manual trigger only:
# pushing code runs ci.yml (lint/build/test), not this. Deploying the images
# to the VPS is also a separate, deliberate, manually-triggered step (see
# docker-deploy.yml and DEPLOY.md).
#
# The "service" input lets you build just one image instead of all 4, e.g.
# when only the landing page changed, no need to rebuild/repush api,
# ml-service, and dashboard too.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service to build'
        type: choice
        options:
          - all
          - api
          - ml-service
          - dashboard
          - landing
        default: all

env:
  IMAGE_PREFIX: ghcr.io/maltoishere/decrity

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Single source of truth for all 4 services; the "service" input
          # just filters this list down with jq, so there's nowhere else to
          # update when adding a 5th package besides this array and the
          # workflow_dispatch "options" list above.
          full='[
            {"name":"api","context":".","dockerfile":"packages/api/Dockerfile","build-args":""},
            {"name":"ml-service","context":"packages/ml-service","dockerfile":"packages/ml-service/Dockerfile","build-args":""},
            {"name":"dashboard","context":".","dockerfile":"packages/dashboard/Dockerfile","build-args":"VITE_DASHBOARD_API_URL=https://api.decrity.malto.icu"},
            {"name":"landing","context":".","dockerfile":"packages/landing/Dockerfile","build-args":""}
          ]'
          if [ "${{ inputs.service }}" = "all" ]; then
            selected="$full"
          else
            selected=$(echo "$full" | jq -c '[.[] | select(.name == "${{ inputs.service }}")]')
          fi
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Add to build summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo "- Status: ${{ steps.build.outcome }}"
            echo "- Image: \`${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest\`"
            echo "- Tag: \`${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}\`"
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
